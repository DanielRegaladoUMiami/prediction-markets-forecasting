[project]
name = "prediction-markets-forecasting"
version = "0.0.1"
description = "Forecasting prediction markets (Kalshi, Polymarket, Robinhood) with a multi-model time-series tournament and exogenous drivers; one notebook per market."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Daniel Regalado" }]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prediction_markets_forecasting"]

[dependency-groups]
dev = ["ruff>=0.6", "pre-commit>=3.7", "pytest>=8.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
