[project]
name = "prediction-markets-forecasting"
version = "0.0.1"
description = "Forecasting prediction markets (Kalshi, Polymarket, Robinhood) with a multi-model time-series tournament and exogenous drivers; one notebook per market."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Daniel Regalado" }]
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=2.2,<3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "statsforecast>=2.1.1",
    "statsmodels>=0.15.0",
    "yfinance>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prediction_markets_forecasting"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "ipykernel>=7.3.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "papermill>=2.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Notebooks: imports live in later cells and printed tables run wide
"*.ipynb" = ["E402", "E501"]
# Notebook cell sources embedded as strings
"scripts/build_template.py" = ["E501"]
